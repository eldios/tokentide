# Copy to secrets.yaml and fill in.
wifi_ssid: "MyWiFi"
wifi_password: "MyWiFiPassword"
# Fallback hotspot password (captive portal shown when WiFi fails)
ap_password: "tokentide"
# Long-lived Claude Code OAuth token: run `claude setup-token` (valid 1 year)
claude_token: "sk-ant-oat01-..."
# Codex (ChatGPT) usage - optional, see packages/provider-openai.yaml.
# Refresh tokens rotate and the old one is single-use, so the device must
# own its chain: run a DEDICATED login the device keeps for itself, e.g.
#   CODEX_HOME=~/.codex-tokentide codex login
# then copy tokens.refresh_token and tokens.account_id from
# ~/.codex-tokentide/auth.json and never use that login elsewhere.
openai_refresh_token: "..."
openai_account_id: "00000000-0000-0000-0000-000000000000"
