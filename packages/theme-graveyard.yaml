    transparency: alpha_channel
  - file: ${theme_sprite_base}/grave-candle-lit-small.png
    id: gy_spr_candle_lit
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/grave-candle-lit-2-small.png
    id: gy_spr_candle_lit2
