# Graveyard theme page. Four stretching ghosts are the progress tracks: the
# body grows along the track with the metric, a ghost head rides the tip and
# a wavy tail caps the start once the body is long enough. Bone-white ghosts
# carry the Claude windows, teal ghosts the Codex windows (shown only when a
# Codex token is configured). Every window shows its written percentage and
# reset countdown. A cemetery strip lives above the rows: crypt, bobbing
# sheet ghosts, flickering grave candles (one lit per 20% of Claude 5h) and,
# on the large panel, tree, tombstones and moon.
#
# Self-contained theme package: it only adds its own lvgl page, images,
# globals and one guarded interval; packages/themes.yaml owns switching.
# Shared ids consumed: usage_5h, usage_7d, codex_* globals, eta_*_text
# strings, usage_status, poll_in_flight, is_screen_off, font_mid,
# font_small. Layout is computed at runtime from the display width; boards
# pick track sprite files via theme_sprite_size (scene sprites always use
# the small files).

substitutions:
  theme_sprite_base: "https://raw.githubusercontent.com/eldios/tokentide/main/assets/sprites"
  theme_sprite_size: "big"
  theme_tap_script: "note_activity"
  theme_long_press_script: "theme_next"

globals:
  - id: theme_graveyard_active
    type: bool
    restore_value: no
    initial_value: "false"

image:
  # Track caps scale with the panel class.
  - file: ${theme_sprite_base}/gy-wisp-head-${theme_sprite_size}-r.png
    id: gy_spr_head
    type: RGB565
    transparency: alpha_channel
