script:
  # Full relayout + data refresh, run on page load and by the 500ms interval
  # below, which also advances the motion clock (ghost bob, candle flicker).
  - id: theme_graveyard_redraw
    mode: single
    then:
      - lambda: |-
          if (!id(theme_graveyard_active) || id(is_screen_off)) return;
          lv_obj_t *scr = lv_scr_act();
          int W = lv_obj_get_width(scr);
          if (W <= 0) return;
          const bool big = W >= 320;
          auto show = [](lv_obj_t *o, bool on) {
            if (on) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else    lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto pct = [](float v) -> float { return v < 0 ? 0 : (v > 100 ? 100 : v); };
          bool c5k = !isnan(id(usage_5h).state);
          bool c7k = !isnan(id(usage_7d).state);
          float c5 = c5k ? pct(id(usage_5h).state) : 0;
          float c7 = c7k ? pct(id(usage_7d).state) : 0;
          bool xp = id(codex_present);
          bool x5k = xp && id(codex_5h_pct) >= 0;
          bool x7k = xp && id(codex_7d_pct) >= 0;
          float x5 = x5k ? pct(id(codex_5h_pct)) : 0;
          float x7 = x7k ? pct(id(codex_7d_pct)) : 0;
          static uint32_t t = 0;
          t++;
          const int BOB[4] = { 0, -1, 0, 1 };
          // --- scene strip (coordinates relative to the clipping band) ---
          lv_obj_set_pos(id(gy_scene), big ? 8 : 4, big ? 22 : 14);
          lv_obj_set_size(id(gy_scene), big ? 304 : 232, big ? 38 : 16);
          lv_obj_set_pos(id(gy_ground), 0, big ? 35 : 15);
          lv_obj_set_size(id(gy_ground), big ? 304 : 232, big ? 3 : 1);
          show(id(gy_moon), big);  lv_obj_set_pos(id(gy_moon), 266, 0);
          show(id(gy_tree), big);  lv_obj_set_pos(id(gy_tree), 0, -6);
          show(id(gy_crypt), big); lv_obj_set_pos(id(gy_crypt), 212, 1);
          show(id(gy_crypt_mini), !big); lv_obj_set_pos(id(gy_crypt_mini), 184, 0);
          show(id(gy_pumpkin), big); lv_obj_set_pos(id(gy_pumpkin), 232, 23);
          show(id(gy_tomb1), big); lv_obj_set_pos(id(gy_tomb1), 38, 18);
          show(id(gy_tomb2), big); lv_obj_set_pos(id(gy_tomb2), 88, 18);
          show(id(gy_tomb3), big); lv_obj_set_pos(id(gy_tomb3), 180, 24);
          // Sheet ghosts patrol: drift between the bounds, occasionally
          // leave past an edge and drift back in; the 1px bob stays.
          const int GSW = big ? 304 : 232;
          const int GLO = 12, GHI = big ? 268 : 196;
          const int GSTEP = big ? 2 : 1;
          static int g_st[2] = { 0, 0 };          // 0 drift 1 leave 2 hidden 3 enter
          static int g_x[2], g_tgt[2] = { 0, 0 };
          static int g_dir[2] = { 1, -1 };
          static int g_rem[2];
          static uint32_t g_rng[2] = { 313, 1597 };
          static int g_face[2] = { 0, 0 };        // 1 = -r, -1 = -l, 0 unset
          static bool g_init = false;
          auto gpick = [&](int sl, int lo, int hi) -> int {
            g_rng[sl] = (25173u * g_rng[sl] + 13849u) % 65536u;
            return lo + (int) (g_rng[sl] % (uint32_t) (hi - lo + 1));
          };
          if (!g_init) {
            g_init = true;
            g_x[0] = big ? 55 : 36;
            g_x[1] = big ? 155 : 124;
            g_rem[0] = gpick(0, 48, 120);
            g_rem[1] = gpick(1, 48, 120);
          }
          lv_obj_t *ghosts[2] = { id(gy_ghost), id(gy_ghost_teal) };
          const void *ghost_r[2] = { id(gy_spr_ghost)->get_lv_image_dsc(), id(gy_spr_ghost_teal)->get_lv_image_dsc() };
          const void *ghost_l[2] = { id(gy_spr_ghost_l)->get_lv_image_dsc(), id(gy_spr_ghost_teal_l)->get_lv_image_dsc() };
          for (int sl = 0; sl < 2; sl++) {
            if (g_st[sl] == 0) {                  // drift between the bounds
              g_x[sl] += g_dir[sl] * GSTEP;
              if (g_x[sl] <= GLO) { g_x[sl] = GLO; g_dir[sl] = 1; }
              if (g_x[sl] >= GHI) { g_x[sl] = GHI; g_dir[sl] = -1; }
              if (--g_rem[sl] <= 0) {
                if (gpick(sl, 0, 65535) / 16384 == 0) {
                  g_st[sl] = 1;                   // wander off the scene
                } else {
                  g_dir[sl] = -g_dir[sl];
                  g_rem[sl] = gpick(sl, 48, 120);
                }
              }
            } else if (g_st[sl] == 1) {           // leaving past an edge
              g_x[sl] += g_dir[sl] * GSTEP;
              if (g_x[sl] <= -24 || g_x[sl] >= GSW) {
                g_x[sl] = (g_x[sl] <= -24) ? -24 : GSW;
                g_st[sl] = 2;
                g_rem[sl] = gpick(sl, 16, 40);
              }
            } else if (g_st[sl] == 2) {           // away from the scene
              if (--g_rem[sl] <= 0) {
                g_dir[sl] = (gpick(sl, 0, 65535) / 32768 == 0) ? 1 : -1;
                g_tgt[sl] = gpick(sl, GLO, GHI);
                g_x[sl] = (g_dir[sl] > 0) ? -24 : GSW;
                g_st[sl] = 3;
              }
            } else {                              // drifting back to a spot
              g_x[sl] += g_dir[sl] * GSTEP;
              if ((g_dir[sl] > 0 && g_x[sl] >= g_tgt[sl]) || (g_dir[sl] < 0 && g_x[sl] <= g_tgt[sl])) {
                g_x[sl] = g_tgt[sl];
                g_st[sl] = 0;
                g_rem[sl] = gpick(sl, 48, 120);
              }
            }
            bool gvis = (g_st[sl] != 2) && (sl == 0 || xp);
            show(ghosts[sl], gvis);
            if (gvis) {
              lv_obj_set_pos(ghosts[sl], g_x[sl], (big ? 2 : 0) + BOB[((t + sl * 3) / 3) % 4]);
              if (g_face[sl] != g_dir[sl]) {
                g_face[sl] = g_dir[sl];
                lv_image_set_src(ghosts[sl], g_dir[sl] > 0 ? ghost_r[sl] : ghost_l[sl]);
              }
            }
          }
          // Roaming act: a zombie shambles through, or a vampire walks in,
          // transforms and a bat flies away; one shared slot with dwells.
          const int RY = big ? 21 : 7;
          static int r_st = 0;                    // 0 wait 1 zwalk 2 vwalk 3 stop 4 transform 5 bat
          static int r_act = 0, r_x = 0, r_y = 0, r_tgt = 0, r_dir = 1, r_ph = 0, r_rem = 0;
          static uint32_t r_rng = 7331;
          static bool r_init = false;
          auto rpick = [&](int lo, int hi) -> int {
            r_rng = (25173u * r_rng + 13849u) % 65536u;
            return lo + (int) (r_rng % (uint32_t) (hi - lo + 1));
          };
          if (!r_init) { r_init = true; r_rem = rpick(24, 48); }
          const void *z_src[2][2] = { { id(gy_spr_z1r)->get_lv_image_dsc(), id(gy_spr_z2r)->get_lv_image_dsc() },
                                      { id(gy_spr_z1l)->get_lv_image_dsc(), id(gy_spr_z2l)->get_lv_image_dsc() } };
          const void *b_src[2][2] = { { id(gy_spr_b1r)->get_lv_image_dsc(), id(gy_spr_b2r)->get_lv_image_dsc() },
                                      { id(gy_spr_b1l)->get_lv_image_dsc(), id(gy_spr_b2l)->get_lv_image_dsc() } };
          if (r_st == 0) {                        // waiting off stage
            if (--r_rem <= 0) {
              r_act = rpick(0, 65535) / 32768;
              r_dir = (rpick(0, 65535) / 32768 == 0) ? 1 : -1;
              r_tgt = rpick(big ? 96 : 72, big ? 192 : 152);
              r_x = (r_dir > 0) ? -10 : GSW;
              r_y = RY;
              r_ph = 0;
              r_st = r_act ? 2 : 1;
              show(id(gy_roamer), true);
              lv_image_set_src(id(gy_roamer), r_act
                  ? (r_dir > 0 ? id(gy_spr_vamp_r)->get_lv_image_dsc() : id(gy_spr_vamp_l)->get_lv_image_dsc())
                  : z_src[r_dir > 0 ? 0 : 1][0]);
            }
          } else if (r_st == 1) {                 // zombie shambles across
            r_ph = (r_ph + 1) % 4;
            if (big || (r_ph % 2) == 0) r_x += r_dir;
            lv_image_set_src(id(gy_roamer), z_src[r_dir > 0 ? 0 : 1][r_ph / 2]);
            lv_obj_set_pos(id(gy_roamer), r_x, r_y);
            if (r_x <= -10 || r_x >= GSW) {
              show(id(gy_roamer), false);
              r_st = 0;
              r_rem = rpick(32, 72);
            }
          } else if (r_st == 2) {                 // vampire walks to its spot
            r_x += r_dir * (big ? 2 : 1);
            if ((r_dir > 0 && r_x >= r_tgt) || (r_dir < 0 && r_x <= r_tgt)) {
              r_x = r_tgt;
              r_st = 3;
              r_rem = rpick(6, 12);
            }
            lv_obj_set_pos(id(gy_roamer), r_x, r_y);
          } else if (r_st == 3) {                 // pause before transforming
            if (--r_rem <= 0) r_st = 4;
          } else if (r_st == 4) {                 // one-tick handoff to bat
            show(id(gy_roamer), false);
            show(id(gy_bat), true);
            lv_image_set_src(id(gy_bat), b_src[r_dir > 0 ? 0 : 1][0]);
            lv_obj_set_pos(id(gy_bat), r_x, r_y);
            r_ph = 0;
            r_st = 5;
          } else {                                // bat flies off diagonally
            r_ph = (r_ph + 1) % 4;
            r_x += r_dir * (big ? 3 : 2);
            r_y -= big ? 2 : 1;
            lv_image_set_src(id(gy_bat), b_src[r_dir > 0 ? 0 : 1][r_ph % 2]);
            lv_obj_set_pos(id(gy_bat), r_x, r_y);
            if (r_x <= -10 || r_x >= GSW || r_y <= -6) {
              show(id(gy_bat), false);
              r_st = 0;
              r_rem = rpick(32, 72);
            }
          }
          // Grave candles: one lights per 20% of Claude 5h; lit flames
          // flicker between two frames every second.
          lv_obj_t *cnd[5] = { id(gy_candle_1), id(gy_candle_2), id(gy_candle_3), id(gy_candle_4), id(gy_candle_5) };
          const int cxb[5] = { 108, 124, 140, 264, 280 };
          const int cxs[5] = { 8, 20, 70, 82, 214 };
          const int thr[5] = { 20, 40, 60, 80, 100 };
          bool flick = ((t / 2) % 2) == 1;
          static int cnd_state[5] = { -1, -1, -1, -1, -1 };
          for (int i = 0; i < 5; i++) {
            lv_obj_set_pos(cnd[i], big ? cxb[i] : cxs[i], big ? 26 : 3);
            int cs = (c5k && c5 >= thr[i]) ? (flick ? 2 : 1) : 0;
            if (cs == cnd_state[i]) continue;
            cnd_state[i] = cs;
            if (cs == 0)      lv_image_set_src(cnd[i], id(gy_spr_candle_out)->get_lv_image_dsc());
            else if (cs == 1) lv_image_set_src(cnd[i], id(gy_spr_candle_lit)->get_lv_image_dsc());
            else              lv_image_set_src(cnd[i], id(gy_spr_candle_lit2)->get_lv_image_dsc());
          }
          // --- data rows: identical grid in every theme (apart from widget
          // id prefixes and the themed track rendering); keep the seven
          // copies in lockstep, per-page widget ids make sharing
          // impractical. Text is set only on change: lv_label_set_text
          // reallocates. ---
          lv_obj_set_pos(id(gy_status), big ? 118 : 166, big ? 2 : 0);
          lv_obj_set_size(id(gy_status), big ? 110 : 70, big ? 20 : 16);
          static std::string st_last;
          std::string st;
          if (id(poll_in_flight)) st = "${str_refreshing}";
          else if (!c5k) {
            // No data yet: surface the poller's error text when there is
            // one, otherwise say the page is waiting.
            if (!id(last_poll_ok) && id(usage_status).has_state()) st = id(usage_status).state;
            else st = "${str_waiting}";
          }
          else st = id(usage_status).has_state() ? id(usage_status).state : "${str_waiting}";
          if (st != st_last) { st_last = st; lv_label_set_text(id(gy_status), st.c_str()); }
          lv_obj_t *lbls[4] = { id(gy_lbl_0), id(gy_lbl_1), id(gy_lbl_2), id(gy_lbl_3) };
          lv_obj_t *vals[4] = { id(gy_val_0), id(gy_val_1), id(gy_val_2), id(gy_val_3) };
          lv_obj_t *etas[4] = { id(gy_eta_0), id(gy_eta_1), id(gy_eta_2), id(gy_eta_3) };
          lv_obj_t *trks[4] = { id(gy_trk_0), id(gy_trk_1), id(gy_trk_2), id(gy_trk_3) };
          lv_obj_t *bodies[4] = { id(gy_body_0), id(gy_body_1), id(gy_body_2), id(gy_body_3) };
          lv_obj_t *tiles[4][11] = {
            { id(gy_bt_0_0), id(gy_bt_0_1), id(gy_bt_0_2), id(gy_bt_0_3), id(gy_bt_0_4), id(gy_bt_0_5), id(gy_bt_0_6), id(gy_bt_0_7), id(gy_bt_0_8), id(gy_bt_0_9), id(gy_bt_0_10) },
            { id(gy_bt_1_0), id(gy_bt_1_1), id(gy_bt_1_2), id(gy_bt_1_3), id(gy_bt_1_4), id(gy_bt_1_5), id(gy_bt_1_6), id(gy_bt_1_7), id(gy_bt_1_8), id(gy_bt_1_9), id(gy_bt_1_10) },
            { id(gy_bt_2_0), id(gy_bt_2_1), id(gy_bt_2_2), id(gy_bt_2_3), id(gy_bt_2_4), id(gy_bt_2_5), id(gy_bt_2_6), id(gy_bt_2_7), id(gy_bt_2_8), id(gy_bt_2_9), id(gy_bt_2_10) },
            { id(gy_bt_3_0), id(gy_bt_3_1), id(gy_bt_3_2), id(gy_bt_3_3), id(gy_bt_3_4), id(gy_bt_3_5), id(gy_bt_3_6), id(gy_bt_3_7), id(gy_bt_3_8), id(gy_bt_3_9), id(gy_bt_3_10) } };
          lv_obj_t *tails[4] = { id(gy_tail_0), id(gy_tail_1), id(gy_tail_2), id(gy_tail_3) };
          lv_obj_t *heads[4] = { id(gy_head_0), id(gy_head_1), id(gy_head_2), id(gy_head_3) };
          const int lyb[4] = { 62, 106, 150, 194 };
          const int lys[4] = { 31, 57, 83, 109 };
          const bool known[4] = { c5k, c7k, x5k, x7k };
          const float val[4] = { c5, c7, x5, x7 };
          // Printed percentages carry the true value (it can exceed 100 at
          // the limit); only geometry and thresholds use the clamped one.
          const float raw[4] = { c5k ? id(usage_5h).state : 0, c7k ? id(usage_7d).state : 0,
                                 x5k ? id(codex_5h_pct) : 0, x7k ? id(codex_7d_pct) : 0 };
          std::string eta[4] = { id(eta_5h_text), id(eta_7d_text), id(eta_codex_5h_text), id(eta_codex_7d_text) };
          static std::string eta_last[4], val_last[4];
          int tx = big ? 16 : 8, tw = big ? 288 : 224, th = big ? 16 : 8;
          int p = big ? 8 : 4;
          int U = tw - 2 * p;
          for (int i = 0; i < 4; i++) {
            int ly = big ? lyb[i] : lys[i];
            bool vis = (i < 2) || xp;
            show(lbls[i], vis); show(vals[i], vis); show(etas[i], vis); show(trks[i], vis);
            if (!vis) { show(bodies[i], false); show(tails[i], false); show(heads[i], false); continue; }
            lv_obj_set_pos(lbls[i], big ? 8 : 4, big ? ly + 4 : ly);
            lv_obj_set_width(lbls[i], big ? 88 : 64);
            lv_obj_set_pos(vals[i], big ? 108 : 72, ly);
            lv_obj_set_width(vals[i], big ? 68 : 46);
            std::string v = "--%";
            if (known[i]) { char b[8]; snprintf(b, sizeof(b), "%d%%", (int) lroundf(raw[i] < 0 ? 0 : raw[i])); v = b; }
            if (v != val_last[i]) { val_last[i] = v; lv_label_set_text(vals[i], v.c_str()); }
            lv_obj_set_pos(etas[i], big ? 180 : 124, big ? ly + 4 : ly);
            lv_obj_set_size(etas[i], big ? 132 : 112, big ? 20 : 16);
            std::string e = std::string("${str_resets_in} ") + eta[i];
            if (e != eta_last[i]) { eta_last[i] = e; lv_label_set_text(etas[i], e.c_str()); }
            int ty = ly + (big ? 28 : 18);
            lv_obj_set_pos(trks[i], tx, ty);
            lv_obj_set_size(trks[i], tw, th);
            // Wavy ghost: a clipping run of scalloped body tiles crawls
            // left so the ghost swims; head rides the tip, tail appears
            // once the body clears it.
            int L = (int) lroundf(U * val[i] / 100.0f);
            int A = tx + p + L;
            int T = big ? 48 : 24;
            int shift = (int) ((t / 2) % T);
            int ntile = big ? 7 : 11;
            if (known[i] && L >= 1) {
              lv_obj_set_pos(bodies[i], tx + p, ty);
              lv_obj_set_size(bodies[i], L, th);
              show(bodies[i], true);
              for (int j = 0; j < 11; j++) {
                show(tiles[i][j], j < ntile);
                if (j < ntile) lv_obj_set_pos(tiles[i][j], j * T - shift, 0);
              }
            } else {
              show(bodies[i], false);
            }
            show(heads[i], known[i]);
            if (known[i]) lv_obj_set_pos(heads[i], A - p, ty);
            bool tail_on = known[i] && L >= (big ? 18 : 9);
            show(tails[i], tail_on);
            if (tail_on) lv_obj_set_pos(tails[i], tx, ty);
          }

interval:
  - interval: 500ms
    then:
      - script.execute: theme_graveyard_redraw
