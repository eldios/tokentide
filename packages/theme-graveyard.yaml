    - id: theme_graveyard_page
      bg_color: 0x0d0d10
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: "id(theme_graveyard_active) = true;"
        # Lay the page out immediately: the interval alone would leave the
        # placeholder geometry on screen for up to one tick.
        - script.execute: theme_graveyard_redraw
      on_unload:
        - lambda: "id(theme_graveyard_active) = false;"
      widgets:
        # Full-page gesture target, bottom of the z-order.
        - obj:
            id: gy_tap
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            on_short_click:
              - script.execute: ${theme_tap_script}
            on_long_press:
