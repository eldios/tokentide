lvgl:
  pages:
    - id: theme_graveyard_page
      bg_color: 0x0d0d10
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: "id(theme_graveyard_active) = true;"
        - script.execute: theme_graveyard_redraw
      on_unload:
        - lambda: "id(theme_graveyard_active) = false;"
      widgets:
        # Full-page gesture target, bottom of the z-order.
        - obj:
            id: gy_tap
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            on_short_click:
              - script.execute: ${theme_tap_script}
            on_long_press:
              - script.execute: ${theme_long_press_script}

        # --- scene strip: children are clipped to the band and positioned
        # relative to it by the redraw script ---
        - obj:
            id: gy_scene
            x: 8
            y: 20
            width: 304
            height: 38
            clickable: false
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "off"
            scrollable: false
            widgets:
              - obj: { id: gy_ground, x: 0, y: 0, width: 10, height: 3, bg_color: 0x29241f, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
              - image: { id: gy_moon, src: gy_spr_moon }
              - image: { id: gy_tree, src: gy_spr_tree }
              - image: { id: gy_crypt, src: gy_spr_crypt }
              - image: { id: gy_crypt_mini, src: gy_spr_crypt_mini, hidden: true }
              - image: { id: gy_pumpkin, src: gy_spr_pumpkin }
              - image: { id: gy_ghost_claude, src: gy_spr_ghost_claude }
              - image: { id: gy_ghost_codex, src: gy_spr_ghost_codex, hidden: true }
              - image: { id: gy_ghost_gemini, src: gy_spr_ghost_gemini, hidden: true }
              - image: { id: gy_tomb1, src: gy_spr_tomb1 }
              - image: { id: gy_tomb2, src: gy_spr_tomb2 }
              - image: { id: gy_tomb3, src: gy_spr_tomb3 }
              - image: { id: gy_roamer, src: gy_spr_z1r, hidden: true }
              - image: { id: gy_bat, src: gy_spr_b1r, hidden: true }
              - image: { id: gy_candle_1, src: gy_spr_candle_out }
              - image: { id: gy_candle_2, src: gy_spr_candle_out }
              - image: { id: gy_candle_3, src: gy_spr_candle_out }
              - image: { id: gy_candle_4, src: gy_spr_candle_out }
              - image: { id: gy_candle_5, src: gy_spr_candle_out }

        # --- 6 window tracks: unelapsed base, elapsed stone fill, overrun tint,
        # scrolling ghost body, tail cap, head at tip, and grave candle pace pin ---
        # Window 0
        - obj: { id: gy_trk_0, x: 0, y: 0, width: 10, height: 16, bg_color: 0x1e2024, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
        - obj: { id: gy_tfill_0, hidden: true, x: 0, y: 0, width: 1, height: 16, bg_color: 0x414444, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
        - obj: { id: gy_ovrun_0, hidden: true, x: 0, y: 0, width: 1, height: 16, bg_color: 0x522426, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
        - obj:
            id: gy_body_0
            hidden: true
            x: 0
            y: 0
            width: 10
            height: 16
            clickable: false
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "off"
            scrollable: false
