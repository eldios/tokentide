              - image: { id: gy_bt_2_7, src: gy_spr_body_codex }
              - image: { id: gy_bt_2_8, src: gy_spr_body_codex }
              - image: { id: gy_bt_2_9, src: gy_spr_body_codex }
        - image: { id: gy_tail_2, src: gy_spr_tail_codex, hidden: true }
        - image: { id: gy_head_2, src: gy_spr_head_codex, hidden: true }
        - image: { id: gy_pace_2, src: gy_spr_pace_ok, hidden: true }

        # Window 3
        - obj: { id: gy_trk_3, hidden: true, x: 0, y: 0, width: 10, height: 16, bg_color: 0x1e2024, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
        - obj: { id: gy_tfill_3, hidden: true, x: 0, y: 0, width: 1, height: 16, bg_color: 0x414444, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
