              - image: { id: gy_bt_1_8, src: gy_spr_body_claude }
              - image: { id: gy_bt_1_9, src: gy_spr_body_claude }
        - image: { id: gy_tail_1, src: gy_spr_tail_claude, hidden: true }
        - image: { id: gy_head_1, src: gy_spr_head_claude, hidden: true }
        - image: { id: gy_pace_1, src: gy_spr_pace_ok, hidden: true }

        # Window 2
        - obj: { id: gy_trk_2, hidden: true, x: 0, y: 0, width: 10, height: 16, bg_color: 0x1e2024, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
        - obj: { id: gy_tfill_2, hidden: true, x: 0, y: 0, width: 1, height: 16, bg_color: 0x414444, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
