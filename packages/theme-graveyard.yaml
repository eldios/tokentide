        - image: { id: gy_tail_0, src: gy_spr_tail_claude, hidden: true }
        - image: { id: gy_head_0, src: gy_spr_head_claude, hidden: true }
        - image: { id: gy_pace_0, src: gy_spr_pace_ok, hidden: true }

