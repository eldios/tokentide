              - image: { id: gy_bt_0_3, src: gy_spr_body_claude }
              - image: { id: gy_bt_0_4, src: gy_spr_body_claude }
              - image: { id: gy_bt_0_5, src: gy_spr_body_claude }
              - image: { id: gy_bt_0_6, src: gy_spr_body_claude }
              - image: { id: gy_bt_0_7, src: gy_spr_body_claude }
              - image: { id: gy_bt_0_8, src: gy_spr_body_claude }
