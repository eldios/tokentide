# Provider-coloured ghosts show usage; grave candles mark elapsed time.
# One or two providers use full-width tracks, three use paired 5h/7d columns.

substitutions:
  theme_sprite_base: "https://raw.githubusercontent.com/eldios/tokentide/v${tokentide_version}/assets/sprites"
  theme_sprite_size: "big"
  str_legend_graveyard: "ghost:used candle:time"
  theme_tap_script: "note_activity"
  theme_long_press_script: "theme_next"

globals:
  - id: theme_graveyard_active
    type: bool
    restore_value: no
    initial_value: "false"

image:
  # Track caps, body tiles, and pace candles scale with the panel class.
  - file: ${theme_sprite_base}/gy-wisp-head-claude-${theme_sprite_size}-r.png
    id: gy_spr_head_claude
    type: RGB565
    transparency: alpha_channel
