# Minimal LVGL UI for small landscape LCDs (240x135, no touch): adaptive
# 1, 2, or 3 provider instrument cluster with Figtree Bold hero digits
# and a coupled dual-horizon pace gauge (budget used vs. time elapsed).

font:
  - file: "gfonts://Figtree@700"
    id: font_hero
    size: 38
    glyphs: "0123456789%?- "
  - file: "gfonts://Figtree@700"
    id: font_hero_2p
    size: 22
    glyphs: "0123456789%?- "
  # UI contract: every UI package provides font_mid and font_small with
  # the full glyph set for theme pages. The default glyph set has no
  # accented letters, which the lang/ packs need.
  - file: "gfonts://Figtree@600"
    id: font_mid
    size: 18
    glyphsets: [GF_Latin_Kernel]
    glyphs: "ÀÁÄÇÈÉÊÌÍÑÒÓÖÙÚÜßàáâäçèéêëìíîïñòóôöùúûü¡¿"
  - file: "gfonts://Figtree@400"
    id: font_small
    size: 13
    glyphsets: [GF_Latin_Kernel]
    glyphs: "ÀÁÄÇÈÉÊÌÍÑÒÓÖÙÚÜßàáâäçèéêëìíîïñòóôöùúûü¡¿"
  - file: "gfonts://Figtree@600"
    id: font_meta
    size: 11
    glyphsets: [GF_Latin_Kernel]
    glyphs: "ÀÁÄÇÈÉÊÌÍÑÒÓÖÙÚÜßàáâäçèéêëìíîïñòóôöùúûü¡¿"

lvgl:
  id: main_lvgl
  displays: [main_lcd]
  buffer_size: 25%
  # Panels in this class are portrait-native 135x240; render landscape.
  rotation: 270
  pages:
    - id: main_page
      bg_color: 0x08090C
      scrollbar_mode: "off"
      scrollable: false
      widgets:
        # --- top status strip (y = 0..16) ---
        # UI contract: every UI provides status_dot and lbl_status.
        - obj:
            id: status_dot
            x: 6
            y: 4
            width: 7
            height: 7
            radius: 4
            bg_color: 0x4CC38A
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            clickable: false
        - label:
            id: lbl_status
            x: 16
            y: 1
            text_font: font_meta
            text_color: 0xECE9E0
            text: "${str_waiting}"
        - obj: { id: batt_box, hidden: true, x: 196, y: 4, width: 12, height: 7, radius: 1, bg_opa: TRANSP, border_width: 1, border_color: 0x8C887F, pad_all: 0, clickable: false }
        - obj: { id: batt_nub, hidden: true, x: 208, y: 6, width: 2, height: 3, radius: 0, bg_color: 0x8C887F, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - obj: { id: batt_fill, hidden: true, x: 198, y: 6, width: 8, height: 3, radius: 0, bg_color: 0x4CC38A, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - label:
            id: lbl_batt
            align: TOP_RIGHT
            x: -6
            y: 1
            text_font: font_meta
            text_color: 0x8C887F
            text: ""
        - obj: { id: hdr_line, x: 6, y: 16, width: 228, height: 1, radius: 0, bg_color: 0x1D202A, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }

        # --- 1-provider sub-header (provider name left, polling cost right) ---
        - label: { id: lbl_1p_title, x: 8, y: 18, text_font: font_small, text_color: 0xD97757, text: "CLAUDE" }
        - label: { id: lbl_footer, x: 90, y: 20, width: 142, text_align: RIGHT, text_font: font_meta, text_color: 0x5C5952, text: "" }

        # --- provider cards, left accents, dividers ---
        - obj: { id: card_0, x: 6, y: 37, width: 110, height: 92, radius: 4, bg_color: 0x12141A, bg_opa: COVER, border_width: 1, border_color: 0x1F232D, pad_all: 0, scrollable: false, scrollbar_mode: "off", clickable: false }
        - obj: { id: accent_0, x: 6, y: 37, width: 4, height: 92, radius: 1, bg_color: 0xD97757, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - obj: { id: card_1, x: 124, y: 37, width: 110, height: 92, radius: 4, bg_color: 0x12141A, bg_opa: COVER, border_width: 1, border_color: 0x1F232D, pad_all: 0, scrollable: false, scrollbar_mode: "off", clickable: false }
        - obj: { id: accent_1, x: 124, y: 37, width: 4, height: 92, radius: 1, bg_color: 0xD97757, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - obj: { id: card_2, hidden: true, x: 6, y: 97, width: 228, height: 36, radius: 3, bg_color: 0x12141A, bg_opa: COVER, border_width: 1, border_color: 0x1F232D, pad_all: 0, scrollable: false, scrollbar_mode: "off", clickable: false }
        - obj: { id: accent_2, hidden: true, x: 6, y: 97, width: 4, height: 36, radius: 1, bg_color: 0x669DF6, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - obj: { id: div_0, hidden: true, x: 122, y: 24, width: 1, height: 44, radius: 0, bg_color: 0x1D202A, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - obj: { id: div_1, hidden: true, x: 122, y: 82, width: 1, height: 44, radius: 0, bg_color: 0x1D202A, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - obj: { id: div_2, hidden: true, x: 121, y: 101, width: 1, height: 28, radius: 0, bg_color: 0x1D202A, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }

        # --- 6 window cells (0..5 = up to 3 providers x {5h, 7d}) ---
        # Cell 0
