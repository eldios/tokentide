interval:
  - interval: 1s
    then:
      - lambda: |-
          auto show = [](lv_obj_t *o, bool on) {
            if (on) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else    lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto now = id(sntp_time).now();
          auto fmt_eta = [&](long reset_epoch, bool short_only, char *out, size_t n) {
            if (reset_epoch <= 0 || !now.is_valid()) { snprintf(out, n, "--"); return; }
            long left = reset_epoch - (long) now.timestamp;
            if (left < 0) left = 0;
            if (left >= 48 * 3600) snprintf(out, n, short_only ? "%ldd" : "%ldd%ldh", left / 86400, (left % 86400) / 3600);
            else if (left >= 3600) snprintf(out, n, short_only ? "%ldh" : "%ldh%02ldm", left / 3600, (left % 3600) / 60);
            else                   snprintf(out, n, "%ldm", left / 60);
          };

          struct ProvSlot {
            const char *short_tag;
            const char *upper;
            uint32_t col;
            int state;
            bool u5_ok, u7_ok;
            float u5_raw, u7_raw;
            float e5, e7;
            long r5, r7;
          };
          bool c5_ok = !isnan(id(usage_5h).state);
          bool c7_ok = !isnan(id(usage_7d).state);
          ProvSlot all_p[3] = {
            { "CLA", "CLAUDE", ${claude_color}, id(claude_state),
              c5_ok, c7_ok, c5_ok ? id(usage_5h).state : 0.0f, c7_ok ? id(usage_7d).state : 0.0f,
              id(elapsed_5h), id(elapsed_7d), id(reset_5h_epoch), id(reset_7d_epoch) },
            { "CDX", "CODEX", ${codex_color}, id(codex_state),
              id(codex_5h_pct) >= 0, id(codex_7d_pct) >= 0, id(codex_5h_pct), id(codex_7d_pct),
              id(elapsed_codex_5h), id(elapsed_codex_7d), id(reset_codex_5h_epoch), id(reset_codex_7d_epoch) },
            { "GEM", "GEMINI", ${gemini_color}, id(gemini_state),
              id(gemini_5h_pct) >= 0, id(gemini_7d_pct) >= 0, id(gemini_5h_pct), id(gemini_7d_pct),
              id(elapsed_gemini_5h), id(elapsed_gemini_7d), id(reset_gemini_5h_epoch), id(reset_gemini_7d_epoch) }
          };
          const bool pres[3] = { id(claude_present), id(codex_present), id(gemini_present) };
          int act[3] = { 0, 1, 2 };
          int N = 0;
          for (int i = 0; i < 3; i++) {
            if (pres[i]) act[N++] = i;
          }
          if (N == 0) { act[0] = 0; N = 1; }

          lv_obj_t *cards[3]   = { id(card_0), id(card_1), id(card_2) };
          lv_obj_t *accents[3] = { id(accent_0), id(accent_1), id(accent_2) };
          lv_obj_t *divs[3]    = { id(div_0), id(div_1), id(div_2) };
          lv_obj_t *trk_u[6]   = { id(trk_u_0), id(trk_u_1), id(trk_u_2), id(trk_u_3), id(trk_u_4), id(trk_u_5) };
          lv_obj_t *trk_t[6]   = { id(trk_t_0), id(trk_t_1), id(trk_t_2), id(trk_t_3), id(trk_t_4), id(trk_t_5) };
          lv_obj_t *f_buf[6]   = { id(fill_buf_0), id(fill_buf_1), id(fill_buf_2), id(fill_buf_3), id(fill_buf_4), id(fill_buf_5) };
          lv_obj_t *f_u[6]     = { id(fill_u_0), id(fill_u_1), id(fill_u_2), id(fill_u_3), id(fill_u_4), id(fill_u_5) };
          lv_obj_t *f_err[6]   = { id(fill_err_0), id(fill_err_1), id(fill_err_2), id(fill_err_3), id(fill_err_4), id(fill_err_5) };
          lv_obj_t *f_t[6]     = { id(fill_t_0), id(fill_t_1), id(fill_t_2), id(fill_t_3), id(fill_t_4), id(fill_t_5) };
          lv_obj_t *ticks[6]   = { id(tick_0), id(tick_1), id(tick_2), id(tick_3), id(tick_4), id(tick_5) };
          lv_obj_t *l_val[6]   = { id(lbl_val_0), id(lbl_val_1), id(lbl_val_2), id(lbl_val_3), id(lbl_val_4), id(lbl_val_5) };
          lv_obj_t *l_hdr[6]   = { id(lbl_hdr_0), id(lbl_hdr_1), id(lbl_hdr_2), id(lbl_hdr_3), id(lbl_hdr_4), id(lbl_hdr_5) };
          lv_obj_t *l_s1[6]    = { id(lbl_sub1_0), id(lbl_sub1_1), id(lbl_sub1_2), id(lbl_sub1_3), id(lbl_sub1_4), id(lbl_sub1_5) };
          lv_obj_t *l_s2[6]    = { id(lbl_sub2_0), id(lbl_sub2_1), id(lbl_sub2_2), id(lbl_sub2_3), id(lbl_sub2_4), id(lbl_sub2_5) };

          auto draw_gauge = [&](int w, int gx, int gy, int gw, int hu, int ht, int gap,
                                bool u_ok, float u_raw, float el, uint32_t col, bool trbl) {
            int yt = gy + hu + gap;
            show(trk_u[w], true);
            lv_obj_set_pos(trk_u[w], gx, gy);
            lv_obj_set_size(trk_u[w], gw, hu);
            show(trk_t[w], true);
            lv_obj_set_pos(trk_t[w], gx, yt);
            lv_obj_set_size(trk_t[w], gw, ht);

            int u_pct = u_ok ? (int) lroundf(u_raw < 0 ? 0 : (u_raw > 100 ? 100 : u_raw)) : 0;
            int t_pct = (el >= 0.0f) ? (int) lroundf(el < 0 ? 0 : (el > 1.0f ? 100 : el * 100.0f)) : -1;
            int uw = (u_ok && u_pct > 0) ? (int) lroundf((gw - 1) * (u_pct / 100.0f)) + 1 : 0;
            int tw = (t_pct > 0) ? (int) lroundf((gw - 1) * (t_pct / 100.0f)) + 1 : 0;
            int tx = (t_pct >= 0) ? gx + (int) lroundf((gw - 1) * (t_pct / 100.0f)) : gx;

            if (t_pct > 0 && tw > uw && hu > 2) {
              show(f_buf[w], true);
              lv_obj_set_pos(f_buf[w], gx + uw, gy + 1);
              lv_obj_set_size(f_buf[w], tw - uw, hu - 2);
            } else {
              show(f_buf[w], false);
            }
            if (uw > 0) {
              show(f_u[w], true);
              lv_obj_set_pos(f_u[w], gx, gy);
              lv_obj_set_size(f_u[w], uw, hu);
              lv_obj_set_style_bg_color(f_u[w], lv_color_hex(col), 0);
            } else {
              show(f_u[w], false);
            }
            if (trbl && t_pct >= 0 && uw > tw && hu >= 5) {
              int eh = (hu >= 7) ? 2 : 1;
              show(f_err[w], true);
              lv_obj_set_pos(f_err[w], gx + tw, gy + hu - eh);
              lv_obj_set_size(f_err[w], uw - tw, eh);
            } else {
              show(f_err[w], false);
            }
            if (tw > 0) {
              show(f_t[w], true);
              lv_obj_set_pos(f_t[w], gx, yt);
              lv_obj_set_size(f_t[w], tw, ht);
            } else {
              show(f_t[w], false);
            }
            if (t_pct >= 0) {
              int top_n = (hu >= 6) ? (gy - 1) : gy;
              int bot_n = yt + ht + 1;
              int nx = (tx + 2 > gx + gw) ? (gx + gw - 2) : tx;
              show(ticks[w], true);
              lv_obj_set_pos(ticks[w], nx, top_n);
              lv_obj_set_size(ticks[w], 2, bot_n - top_n);
              lv_obj_set_style_bg_color(ticks[w], lv_color_hex(trbl ? 0xFF5A52 : 0xEEE1B5), 0);
            } else {
              show(ticks[w], false);
            }
          };

          for (int w = 2 * N; w < 6; w++) {
            show(trk_u[w], false); show(trk_t[w], false); show(f_buf[w], false);
            show(f_u[w], false);   show(f_err[w], false); show(f_t[w], false);
            show(ticks[w], false); show(l_val[w], false); show(l_hdr[w], false);
            show(l_s1[w], false);  show(l_s2[w], false);
          }

          show(id(lbl_1p_title), N == 1);
          show(id(lbl_footer), N == 1);

          char buf[48], eta[20];
          if (N == 1) {
            const auto &p = all_p[act[0]];
            lv_label_set_text(id(lbl_1p_title), p.upper);
            lv_obj_set_style_text_color(id(lbl_1p_title), lv_color_hex(p.col), 0);
            int toks_per_day = 86400 / ${poll_interval};
            lv_label_set_text_fmt(id(lbl_footer), "poll ${poll_interval}s | ~%d/d", toks_per_day);

            show(cards[2], false); show(accents[2], false);
            show(divs[0], false);  show(divs[1], false); show(divs[2], false);

            const int cxs[2] = { 6, 124 };
            const char *wtags[2] = { "5h", "7d" };
            const bool u_oks[2] = { p.u5_ok, p.u7_ok };
            const float u_raws[2] = { p.u5_raw, p.u7_raw };
            const float els[2] = { p.e5, p.e7 };
            const long r_eps[2] = { p.r5, p.r7 };

            for (int w = 0; w < 2; w++) {
              int cx = cxs[w];
              bool tr = tokentide_poller::window_off_pace(u_oks[w], u_raws[w], els[w]);
              show(cards[w], true); show(accents[w], true);
              lv_obj_set_pos(cards[w], cx, 37);
              lv_obj_set_size(cards[w], 110, 92);
              lv_obj_set_style_radius(cards[w], 4, 0);
              lv_obj_set_style_border_color(cards[w], lv_color_hex(tr ? 0x522426 : 0x1F232D), 0);
              lv_obj_set_pos(accents[w], cx, 37);
              lv_obj_set_size(accents[w], 4, 92);
              lv_obj_set_style_bg_color(accents[w], lv_color_hex(p.col), 0);

              show(l_hdr[w], true);
              lv_obj_set_pos(l_hdr[w], cx + 8, 40);
              lv_obj_set_width(l_hdr[w], 36);
              lv_obj_set_style_text_align(l_hdr[w], LV_TEXT_ALIGN_LEFT, 0);
              lv_obj_set_style_text_color(l_hdr[w], lv_color_hex(0xECE9E0), 0);
              lv_label_set_text(l_hdr[w], wtags[w]);

              show(l_s1[w], true);
              lv_obj_set_pos(l_s1[w], cx + 46, 40);
              lv_obj_set_width(l_s1[w], 58);
              lv_obj_set_style_text_align(l_s1[w], LV_TEXT_ALIGN_RIGHT, 0);
              lv_obj_set_style_text_color(l_s1[w], lv_color_hex(tr ? 0xFF5A52 : 0x8C887F), 0);
              fmt_eta(r_eps[w], false, eta, sizeof(eta));
              lv_label_set_text(l_s1[w], eta);

              show(l_val[w], true);
              lv_obj_set_style_text_font(l_val[w], id(font_hero), 0);
              lv_obj_set_pos(l_val[w], cx + 8, 47);
              lv_obj_set_style_text_color(l_val[w], lv_color_hex(p.col), 0);
              if (u_oks[w]) snprintf(buf, sizeof(buf), "%d%%", (int) lroundf(u_raws[w] < 0 ? 0 : u_raws[w]));
              else          snprintf(buf, sizeof(buf), "--%%");
              lv_label_set_text(l_val[w], buf);

              draw_gauge(w, cx + 8, 100, 96, 8, 3, 2, u_oks[w], u_raws[w], els[w], p.col, tr);

              show(l_s2[w], true);
              lv_obj_set_pos(l_s2[w], cx + 8, 113);
              lv_obj_set_width(l_s2[w], 96);
              lv_obj_set_style_text_align(l_s2[w], LV_TEXT_ALIGN_LEFT, 0);
              lv_obj_set_style_text_color(l_s2[w], lv_color_hex(tr ? 0xFF5A52 : 0x8C887F), 0);
              if (els[w] >= 0.0f) snprintf(buf, sizeof(buf), tr ? "${str_time} %d%% !" : "${str_time} %d%%", (int) lroundf(els[w] * 100.0f));
              else if (p.state == tokentide_poller::STATE_NO_DATA) snprintf(buf, sizeof(buf), "${str_no_data}");
              else                snprintf(buf, sizeof(buf), "${str_time} --%%");
              lv_label_set_text(l_s2[w], buf);
            }
          } else if (N == 2) {
            const int cys[2] = { 19, 77 };
            show(cards[2], false); show(accents[2], false); show(divs[2], false);
            for (int pi = 0; pi < 2; pi++) {
              const auto &p = all_p[act[pi]];
              int cy = cys[pi];
              bool tr0 = tokentide_poller::window_off_pace(p.u5_ok, p.u5_raw, p.e5);
              bool tr1 = tokentide_poller::window_off_pace(p.u7_ok, p.u7_raw, p.e7);
              show(cards[pi], true); show(accents[pi], true);
              lv_obj_set_pos(cards[pi], 6, cy);
              lv_obj_set_size(cards[pi], 228, 54);
              lv_obj_set_style_radius(cards[pi], 4, 0);
              lv_obj_set_style_border_color(cards[pi], lv_color_hex((tr0 || tr1) ? 0x522426 : 0x1F232D), 0);
              lv_obj_set_pos(accents[pi], 6, cy);
              lv_obj_set_size(accents[pi], 4, 54);
              lv_obj_set_style_bg_color(accents[pi], lv_color_hex(p.col), 0);

              show(divs[pi], true);
              lv_obj_set_pos(divs[pi], 122, cy + 5);
              lv_obj_set_size(divs[pi], 1, 44);

              const bool u_oks[2] = { p.u5_ok, p.u7_ok };
              const float u_raws[2] = { p.u5_raw, p.u7_raw };
              const float els[2] = { p.e5, p.e7 };
              const long r_eps[2] = { p.r5, p.r7 };
              const bool trs[2] = { tr0, tr1 };
              for (int wi = 0; wi < 2; wi++) {
                int w = pi * 2 + wi;
                int wx = (wi == 0) ? 14 : 128;
                int ww = (wi == 0) ? 102 : 100;
                int hr = wx + ww;
                bool tr = trs[wi];

                show(l_hdr[w], true);
                lv_obj_set_pos(l_hdr[w], wx, cy + 1);
                lv_obj_set_width(l_hdr[w], 52);
                lv_obj_set_style_text_align(l_hdr[w], LV_TEXT_ALIGN_LEFT, 0);
                lv_obj_set_style_text_color(l_hdr[w], lv_color_hex((wi == 0) ? p.col : 0xECE9E0), 0);
                if (wi == 0) snprintf(buf, sizeof(buf), "%s 5h", p.short_tag);
                else         snprintf(buf, sizeof(buf), "7d");
                lv_label_set_text(l_hdr[w], buf);

                show(l_s1[w], true);
                lv_obj_set_pos(l_s1[w], hr - 52, cy + 1);
                lv_obj_set_width(l_s1[w], 52);
                lv_obj_set_style_text_align(l_s1[w], LV_TEXT_ALIGN_RIGHT, 0);
                lv_obj_set_style_text_color(l_s1[w], lv_color_hex(tr ? 0xFF5A52 : 0x8C887F), 0);
                fmt_eta(r_eps[wi], false, eta, sizeof(eta));
                lv_label_set_text(l_s1[w], eta);

                show(l_val[w], true);
                lv_obj_set_style_text_font(l_val[w], id(font_hero_2p), 0);
                lv_obj_set_pos(l_val[w], wx, cy + 10);
                lv_obj_set_style_text_color(l_val[w], lv_color_hex(p.col), 0);
                if (u_oks[wi]) snprintf(buf, sizeof(buf), "%d%%", (int) lroundf(u_raws[wi] < 0 ? 0 : u_raws[wi]));
                else           snprintf(buf, sizeof(buf), "--%%");
                lv_label_set_text(l_val[w], buf);

                show(l_s2[w], true);
                lv_obj_set_pos(l_s2[w], hr - 56, cy + 20);
                lv_obj_set_width(l_s2[w], 56);
                lv_obj_set_style_text_align(l_s2[w], LV_TEXT_ALIGN_RIGHT, 0);
                lv_obj_set_style_text_color(l_s2[w], lv_color_hex(tr ? 0xFF5A52 : 0xEEE1B5), 0);
                if (p.state == tokentide_poller::STATE_NO_DATA) snprintf(buf, sizeof(buf), "${str_no_data_short}");
                else if (els[wi] >= 0.0f) snprintf(buf, sizeof(buf), "${str_time} %d%%", (int) lroundf(els[wi] * 100.0f));
                else                      snprintf(buf, sizeof(buf), "${str_time} --%%");
                lv_label_set_text(l_s2[w], buf);

                draw_gauge(w, wx, cy + 39, ww, 7, 3, 2, u_oks[wi], u_raws[wi], els[wi], p.col, tr);
              }
            }
          } else {
            const int cys[3] = { 19, 58, 97 };
            for (int pi = 0; pi < 3; pi++) {
              const auto &p = all_p[act[pi]];
              int cy = cys[pi];
              bool tr0 = tokentide_poller::window_off_pace(p.u5_ok, p.u5_raw, p.e5);
              bool tr1 = tokentide_poller::window_off_pace(p.u7_ok, p.u7_raw, p.e7);
              show(cards[pi], true); show(accents[pi], true);
              lv_obj_set_pos(cards[pi], 6, cy);
              lv_obj_set_size(cards[pi], 228, 36);
              lv_obj_set_style_radius(cards[pi], 3, 0);
              lv_obj_set_style_border_color(cards[pi], lv_color_hex((tr0 || tr1) ? 0x522426 : 0x1F232D), 0);
              lv_obj_set_pos(accents[pi], 6, cy);
              lv_obj_set_size(accents[pi], 4, 36);
              lv_obj_set_style_bg_color(accents[pi], lv_color_hex(p.col), 0);

              show(divs[pi], true);
              lv_obj_set_pos(divs[pi], 121, cy + 4);
              lv_obj_set_size(divs[pi], 1, 28);

              const bool u_oks[2] = { p.u5_ok, p.u7_ok };
              const float u_raws[2] = { p.u5_raw, p.u7_raw };
              const float els[2] = { p.e5, p.e7 };
              const long r_eps[2] = { p.r5, p.r7 };
              const bool trs[2] = { tr0, tr1 };
              for (int wi = 0; wi < 2; wi++) {
                int w = pi * 2 + wi;
                int wx = (wi == 0) ? 13 : 126;
                int ww = (wi == 0) ? 104 : 102;
                int hr = wx + ww;
                bool tr = trs[wi];

                show(l_val[w], true);
                lv_obj_set_style_text_font(l_val[w], id(font_mid), 0);
                lv_obj_set_pos(l_val[w], wx, cy - 4);
                lv_obj_set_style_text_color(l_val[w], lv_color_hex(p.col), 0);
                if (u_oks[wi]) snprintf(buf, sizeof(buf), "%d%%", (int) lroundf(u_raws[wi] < 0 ? 0 : u_raws[wi]));
                else           snprintf(buf, sizeof(buf), "--%%");
                lv_label_set_text(l_val[w], buf);

                show(l_hdr[w], true);
                lv_obj_set_pos(l_hdr[w], hr - 60, cy + 2);
                lv_obj_set_width(l_hdr[w], 60);
                lv_obj_set_style_text_align(l_hdr[w], LV_TEXT_ALIGN_RIGHT, 0);
                lv_obj_set_style_text_color(l_hdr[w], lv_color_hex(tr ? 0xFF5A52 : 0x8C887F), 0);
                fmt_eta(r_eps[wi], wi == 0, eta, sizeof(eta));
                if (p.state == tokentide_poller::STATE_NO_DATA) snprintf(eta, sizeof(eta), "${str_no_data_short}");
                if (wi == 0) snprintf(buf, sizeof(buf), "%s %s", p.short_tag, eta);
                else         snprintf(buf, sizeof(buf), "7d %s", eta);
                lv_label_set_text(l_hdr[w], buf);

                show(l_s1[w], false);
                show(l_s2[w], false);
                draw_gauge(w, wx, cy + 23, ww, 5, 2, 1, u_oks[wi], u_raws[wi], els[wi], p.col, tr);
              }
            }
          }

          // Top status from the engine's device status.
          uint32_t dot_col = 0x4CC38A;
          uint32_t st_col  = 0xECE9E0;
          static std::string st_last;
          if (id(status_text) != st_last) {
            st_last = id(status_text);
            lv_label_set_text(id(lbl_status), st_last.c_str());
          }
          if (id(status_alert)) { dot_col = 0xFF5A52; st_col = 0xFF5A52; }
          if (id(anthropic_status).has_state()) {
            const auto &ind = id(anthropic_status).state;
            if (ind == "critical")   dot_col = 0xE5484D;
            else if (ind == "major") dot_col = 0xF76B15;
            else if (ind != "none" && ind != "unknown" && !ind.empty()) dot_col = 0xF5D90A;
          }
          show(id(status_dot), true);
          lv_obj_set_style_bg_color(id(status_dot), lv_color_hex(dot_col), 0);
          lv_obj_set_style_text_color(id(lbl_status), lv_color_hex(st_col), 0);

          int batt = isnan(id(battery_level).state) ? -1 : (int) id(battery_level).state;
          if (batt >= 0) {
            lv_label_set_text_fmt(id(lbl_batt), "%d%%", batt);
            lv_obj_update_layout(id(lbl_batt));
            int tw = lv_obj_get_width(id(lbl_batt));
            int bx = 234 - (12 + 2 + 4 + tw);
            int fw = (int) lroundf(8.0f * (batt < 0 ? 0 : (batt > 100 ? 100 : batt)) / 100.0f);
            if (fw < 1) fw = 1;
            show(id(batt_box), true);  lv_obj_set_pos(id(batt_box), bx, 4);
            show(id(batt_nub), true);  lv_obj_set_pos(id(batt_nub), bx + 12, 6);
            show(id(batt_fill), true); lv_obj_set_pos(id(batt_fill), bx + 2, 6);
            lv_obj_set_size(id(batt_fill), fw, 3);
            lv_obj_set_style_bg_color(id(batt_fill), lv_color_hex(batt > 25 ? 0x4CC38A : 0xFF5A52), 0);
          } else {
            lv_label_set_text(id(lbl_batt), "");
            show(id(batt_box), false); show(id(batt_nub), false); show(id(batt_fill), false);
          }
