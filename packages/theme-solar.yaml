lvgl:
  pages:
    - id: theme_solar_page
      bg_color: 0x0d0d10
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: "id(theme_solar_active) = true;"
        # Lay the page out immediately: the interval alone would leave the
        # placeholder geometry on screen for up to one tick.
        - script.execute: theme_solar_redraw
      on_unload:
        - lambda: "id(theme_solar_active) = false;"
      widgets:
        - obj:
            id: so_tap
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            on_short_click:
              - script.execute: ${theme_tap_script}
            on_long_press:
              - script.execute: ${theme_long_press_script}
        # --- lunar base strip ---
        - obj:
            id: so_scene
            x: 8
            y: 22
            width: 304
            height: 38
            clickable: false
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "off"
            scrollable: false
            widgets:
              - image: { id: so_moon, src: so_spr_moon }
