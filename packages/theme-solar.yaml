# Moon: rockets show usage; crescent beacons and the lower rail show elapsed time.
# The scene cycles flags only among configured providers.

substitutions:
  theme_sprite_base: "https://raw.githubusercontent.com/eldios/tokentide/v${tokentide_version}/assets/sprites"
  theme_sprite_size: "big"
  str_legend_moon: "rocket:used moon:time"
  theme_tap_script: "note_activity"
  theme_long_press_script: "theme_next"

globals:
  - id: theme_solar_active
    type: bool
    restore_value: no
    initial_value: "false"

