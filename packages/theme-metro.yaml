script:
  - id: theme_metro_redraw
    mode: single
    then:
      - lambda: |-
          if (!id(theme_metro_active) || id(is_screen_off)) return;
          lv_obj_t *scr = lv_scr_act();
          int W = lv_obj_get_width(scr);
          if (W <= 0) return;
          const bool big = W >= 320;
          auto show = [](lv_obj_t *o, bool on) {
            if (on) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else    lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto pct = [](float v) -> float { return v < 0 ? 0 : (v > 100 ? 100 : v); };
          struct ProvData {
            const char *name;
            const char *short_name;
            uint32_t col;
            int state;
            bool u5_ok, u7_ok;
            float u5_raw, u7_raw;
            float e5, e7;
            const std::string *eta5, *eta7;
            const void *car_dsc;
          };
          bool c5k = !isnan(id(usage_5h).state);
          bool c7k = !isnan(id(usage_7d).state);
          bool x5k = id(codex_5h_pct) >= 0.0f;
          bool x7k = id(codex_7d_pct) >= 0.0f;
          bool g5k = id(gemini_5h_pct) >= 0.0f;
          bool g7k = id(gemini_7d_pct) >= 0.0f;
          ProvData all_p[3] = {
            { "${claude_label}", "Cla", ${claude_color}, id(claude_state),
              c5k, c7k, c5k ? id(usage_5h).state : 0.0f, c7k ? id(usage_7d).state : 0.0f,
              id(elapsed_5h), id(elapsed_7d), &id(eta_5h_text), &id(eta_7d_text),
              id(me_spr_car_claude)->get_lv_image_dsc() },
            { "${codex_label}", "Cdx", ${codex_color}, id(codex_state),
              x5k, x7k, x5k ? id(codex_5h_pct) : 0.0f, x7k ? id(codex_7d_pct) : 0.0f,
              id(elapsed_codex_5h), id(elapsed_codex_7d), &id(eta_codex_5h_text), &id(eta_codex_7d_text),
              id(me_spr_car_codex)->get_lv_image_dsc() },
            { "${gemini_label}", "Gem", ${gemini_color}, id(gemini_state),
              g5k, g7k, g5k ? id(gemini_5h_pct) : 0.0f, g7k ? id(gemini_7d_pct) : 0.0f,
              id(elapsed_gemini_5h), id(elapsed_gemini_7d), &id(eta_gemini_5h_text), &id(eta_gemini_7d_text),
              id(me_spr_car_gemini)->get_lv_image_dsc() }
          };

          const bool pres[3] = { id(claude_present), id(codex_present), id(gemini_present) };
          int act[3] = { 0, 1, 2 };
          int N = 0;
          for (int i = 0; i < 3; i++) {
            if (pres[i]) act[N++] = i;
          }
          const bool none_configured = (N == 0);
          if (none_configured) { act[0] = 0; N = 1; }

          static uint32_t t = 0;
          t++;
          const int BOB[4] = { 0, -1, 0, 1 };
          int bob = BOB[(t / 3) % 4];
          lv_obj_set_pos(id(me_scene), big ? 8 : 4, big ? 20 : 13);
          lv_obj_set_size(id(me_scene), big ? 304 : 232, big ? 40 : 17);
          int sgx = big ? 68 : 0, sgw = big ? 168 : 124, sgh = big ? 24 : 13;
          lv_obj_set_pos(id(me_sign_field), sgx, 1);
          lv_obj_set_size(id(me_sign_field), sgw, sgh - 1);
          lv_obj_set_pos(id(me_sign_inset), sgx + 2, 2);
          lv_obj_set_size(id(me_sign_inset), sgw - 4, sgh - 3);
          lv_obj_set_pos(id(me_sign_post_l), sgx + 2, sgh);
          lv_obj_set_pos(id(me_sign_post_r), sgx + sgw - 3, sgh);
          lv_obj_set_pos(id(me_sign_lbl), big ? 80 : 8, big ? 22 : 13);
          lv_obj_set_width(id(me_sign_lbl), big ? 160 : 116);
          lv_obj_set_pos(id(me_edge), 0, big ? 38 : 15);
          lv_obj_set_size(id(me_edge), big ? 304 : 232, 2);
          lv_obj_set_pos(id(me_edge_hl), 0, big ? 38 : 15);
          lv_obj_set_size(id(me_edge_hl), big ? 304 : 232, 1);
          // Commuter slots: spawn, walk to a stand spot, tap a foot, leave.
          lv_obj_t *actors[3] = { id(me_actor_a), id(me_actor_b), id(me_actor_c) };
          const void *act1[3] = { id(me_spr_actor_a_1)->get_lv_image_dsc(), id(me_spr_actor_b_1)->get_lv_image_dsc(), id(me_spr_actor_c_1)->get_lv_image_dsc() };
          const void *act2[3] = { id(me_spr_actor_a_2)->get_lv_image_dsc(), id(me_spr_actor_b_2)->get_lv_image_dsc(), id(me_spr_actor_c_2)->get_lv_image_dsc() };
          const int lob[3] = { 16, 124, 230 };
          const int hib[3] = { 72, 172, 286 };
          const int los[3] = { 136, 166, 196 };
          const int his[3] = { 150, 180, 220 };
          static int ast[3] = { 2, 2, 2 };
          static int ax[3], atgt[3], arem[3];
          static int adir[3] = { 1, -1, 1 };
          static uint32_t arng[3] = { 117, 911, 2027 };
          static int afr[3] = { -1, -1, -1 };
          static bool ainit = false;
          auto pick = [&](int s2, int lo, int hi) -> int {
            arng[s2] = (25173u * arng[s2] + 13849u) % 65536u;
            return lo + (int) (arng[s2] % (uint32_t) (hi - lo + 1));
          };
          int sw = big ? 304 : 232;
          const int entry = big ? -8 : 128;
          int ay = big ? 24 : 1;
          int astep = big ? 2 : 1;
          if (!ainit) {
            ainit = true;
            for (int s2 = 0; s2 < 3; s2++) {
              atgt[s2] = pick(s2, big ? lob[s2] : los[s2], big ? hib[s2] : his[s2]);
              ax[s2] = atgt[s2];
              arem[s2] = pick(s2, 12 + s2 * 2, 24 + s2 * 2);
            }
          }
          for (int s2 = 0; s2 < 3; s2++) {
            if (!pres[s2]) { show(actors[s2], false); continue; }
            int lo = big ? lob[s2] : los[s2];
            int hi = big ? hib[s2] : his[s2];
            if (ast[s2] == 0) {
              if (--arem[s2] <= 0) {
                adir[s2] = (pick(s2, 0, 1) == 0) ? 1 : -1;
                atgt[s2] = pick(s2, lo, hi);
                ax[s2] = (adir[s2] > 0) ? entry : sw;
                ast[s2] = 1;
              }
            } else if (ast[s2] == 1) {
              ax[s2] += (adir[s2] > 0) ? astep : -astep;
              if ((adir[s2] > 0 && ax[s2] >= atgt[s2]) || (adir[s2] < 0 && ax[s2] <= atgt[s2])) {
                ax[s2] = atgt[s2];
                ast[s2] = 2;
                arem[s2] = pick(s2, 12 + s2 * 2, 24 + s2 * 2);
              }
            } else if (ast[s2] == 2) {
              if (--arem[s2] <= 0) ast[s2] = 3;
            } else {
              ax[s2] += (adir[s2] > 0) ? astep : -astep;
              if (ax[s2] <= entry || ax[s2] >= sw) {
                ast[s2] = 0;
                arem[s2] = pick(s2, 4, 12);
              }
            }
            bool on = ast[s2] != 0;
            show(actors[s2], on);
            if (on) {
              lv_obj_set_pos(actors[s2], ax[s2], ay);
              int fr = (int) (((t + s2) / 2) % 2);
              if (fr != afr[s2]) { afr[s2] = fr; lv_image_set_src(actors[s2], fr ? act2[s2] : act1[s2]); }
            }
          }
          lv_obj_set_style_text_font(id(me_sign_lbl), big ? id(font_small) : id(font_meta), 0);
          static bool sign_big = !big;
          if (sign_big != big) {
            sign_big = big;
            lv_label_set_text(id(me_sign_lbl), big ? "Agents Metro Station" : "Agents Metro");
          }
          lv_obj_set_pos(id(me_legend), big ? 8 : 4, big ? 2 : 0);
          static bool legend_big = !big;
          if (legend_big != big) {
            legend_big = big;
            lv_label_set_text(id(me_legend), big ? "${str_legend_metro}" : "${str_legend_metro_short}");
          }
          lv_obj_set_y(id(me_status), big ? 2 : 0);
          // Device status from the engine. The status keeps its full text
          // up to most of the bar and scrolls beyond it; the legend gets the
          // room left of it.
          static std::string st_last;
          const std::string &st = id(status_text);
          if (st != st_last) {
            st_last = st;
            lv_label_set_text(id(me_status), st.c_str());
            lv_obj_set_width(id(me_status), LV_SIZE_CONTENT);
            lv_obj_update_layout(id(me_status));
            const int right = big ? 312 : 236, legend_x = (big ? 8 : 4);
            int sw = lv_obj_get_width(id(me_status));
            int sw_max = big ? 200 : 150;
            if (sw > sw_max) { sw = sw_max; lv_obj_set_width(id(me_status), sw); }
            lv_obj_set_x(id(me_status), right - sw);
            lv_obj_set_width(id(me_legend), right - sw - legend_x - 6);
          }

          lv_obj_set_style_text_color(id(me_status), lv_color_hex(id(status_alert) ? 0xff6b6b : 0xeee1b5), 0);
          lv_obj_t *lbls[6] = { id(me_lbl_0), id(me_lbl_1), id(me_lbl_2), id(me_lbl_3), id(me_lbl_4), id(me_lbl_5) };
          lv_obj_t *vals[6] = { id(me_val_0), id(me_val_1), id(me_val_2), id(me_val_3), id(me_val_4), id(me_val_5) };
          lv_obj_t *etas[6] = { id(me_eta_0), id(me_eta_1), id(me_eta_2), id(me_eta_3), id(me_eta_4), id(me_eta_5) };
          lv_obj_t *routes[6] = { id(me_route_0), id(me_route_1), id(me_route_2), id(me_route_3), id(me_route_4), id(me_route_5) };
          lv_obj_t *tbeds[6] = { id(me_tbed_0), id(me_tbed_1), id(me_tbed_2), id(me_tbed_3), id(me_tbed_4), id(me_tbed_5) };
          lv_obj_t *obeds[6] = { id(me_obed_0), id(me_obed_1), id(me_obed_2), id(me_obed_3), id(me_obed_4), id(me_obed_5) };
          lv_obj_t *fils[6] = { id(me_fill_0), id(me_fill_1), id(me_fill_2), id(me_fill_3), id(me_fill_4), id(me_fill_5) };
          lv_obj_t *cars[6] = { id(me_car_0), id(me_car_1), id(me_car_2), id(me_car_3), id(me_car_4), id(me_car_5) };
          lv_obj_t *signals[6] = { id(me_sig_0), id(me_sig_1), id(me_sig_2), id(me_sig_3), id(me_sig_4), id(me_sig_5) };
          lv_obj_t *rails[6][10] = {
            { id(me_rail_0_0), id(me_rail_0_1), id(me_rail_0_2), id(me_rail_0_3), id(me_rail_0_4), id(me_rail_0_5), id(me_rail_0_6), id(me_rail_0_7), id(me_rail_0_8), id(me_rail_0_9) },
            { id(me_rail_1_0), id(me_rail_1_1), id(me_rail_1_2), id(me_rail_1_3), id(me_rail_1_4), id(me_rail_1_5), id(me_rail_1_6), id(me_rail_1_7), id(me_rail_1_8), id(me_rail_1_9) },
            { id(me_rail_2_0), id(me_rail_2_1), id(me_rail_2_2), id(me_rail_2_3), id(me_rail_2_4), id(me_rail_2_5), id(me_rail_2_6), id(me_rail_2_7), id(me_rail_2_8), id(me_rail_2_9) },
            { id(me_rail_3_0), id(me_rail_3_1), id(me_rail_3_2), id(me_rail_3_3), id(me_rail_3_4), id(me_rail_3_5), id(me_rail_3_6), id(me_rail_3_7), id(me_rail_3_8), id(me_rail_3_9) },
            { id(me_rail_4_0), id(me_rail_4_1), id(me_rail_4_2), id(me_rail_4_3), id(me_rail_4_4), nullptr, nullptr, nullptr, nullptr, nullptr },
            { id(me_rail_5_0), id(me_rail_5_1), id(me_rail_5_2), id(me_rail_5_3), id(me_rail_5_4), nullptr, nullptr, nullptr, nullptr, nullptr } };
          lv_obj_t *sts[6][6] = {
            { id(me_st_0_0), id(me_st_0_1), id(me_st_0_2), id(me_st_0_3), id(me_st_0_4), id(me_st_0_5) },
            { id(me_st_1_0), id(me_st_1_1), id(me_st_1_2), id(me_st_1_3), id(me_st_1_4), id(me_st_1_5) },
            { id(me_st_2_0), id(me_st_2_1), id(me_st_2_2), id(me_st_2_3), id(me_st_2_4), id(me_st_2_5) },
            { id(me_st_3_0), id(me_st_3_1), id(me_st_3_2), id(me_st_3_3), id(me_st_3_4), id(me_st_3_5) },
            { id(me_st_4_0), id(me_st_4_1), id(me_st_4_2), id(me_st_4_3), id(me_st_4_4), id(me_st_4_5) },
            { id(me_st_5_0), id(me_st_5_1), id(me_st_5_2), id(me_st_5_3), id(me_st_5_4), id(me_st_5_5) } };
          lv_obj_t *ins[6][6] = {
            { id(me_in_0_0), id(me_in_0_1), id(me_in_0_2), id(me_in_0_3), id(me_in_0_4), id(me_in_0_5) },
            { id(me_in_1_0), id(me_in_1_1), id(me_in_1_2), id(me_in_1_3), id(me_in_1_4), id(me_in_1_5) },
            { id(me_in_2_0), id(me_in_2_1), id(me_in_2_2), id(me_in_2_3), id(me_in_2_4), id(me_in_2_5) },
            { id(me_in_3_0), id(me_in_3_1), id(me_in_3_2), id(me_in_3_3), id(me_in_3_4), id(me_in_3_5) },
            { id(me_in_4_0), id(me_in_4_1), id(me_in_4_2), id(me_in_4_3), id(me_in_4_4), id(me_in_4_5) },
            { id(me_in_5_0), id(me_in_5_1), id(me_in_5_2), id(me_in_5_3), id(me_in_5_4), id(me_in_5_5) } };
          static std::string lbl_last[6], val_last[6], eta_last[6];
          static int slot_prov_last[6] = { -1, -1, -1, -1, -1, -1 };
          static int slot_trbl_last[6] = { -1, -1, -1, -1, -1, -1 };
          static int slot_mode_last[6] = { -1, -1, -1, -1, -1, -1 };

          const void *pace_ok_dsc = id(me_spr_sig_ok)->get_lv_image_dsc();
          const void *pace_tr_dsc = id(me_spr_sig_trouble)->get_lv_image_dsc();
          const int ry1_b[2] = { 76, 154 }, ry1_s[2] = { 40, 86 };
          const int ry2_b[4] = { 62, 106, 150, 194 }, ry2_s[4] = { 31, 56, 81, 107 };
          const int ry3_b[3] = { 60, 120, 180 }, ry3_s[3] = { 31, 65, 99 };
          for (int i = 0; i < 6; i++) {
            bool vis = (i < 2 * N);
            show(lbls[i], vis); show(vals[i], vis); show(etas[i], vis); show(routes[i], vis);
            if (!vis) {
              show(signals[i], false);
              continue;
            }

            int p_idx = i / 2;
            int win = i % 2;
            int prov_id = act[p_idx];
            const auto &p = all_p[prov_id];
            bool u_ok = !none_configured && ((win == 0) ? p.u5_ok : p.u7_ok);
            float u_raw = (win == 0) ? p.u5_raw : p.u7_raw;
            float u_val = u_ok ? pct(u_raw) : 0.0f;
            float el = (win == 0) ? p.e5 : p.e7;
            bool t_ok = !none_configured && (el >= 0.0f);
            float t_val = t_ok ? pct(el * 100.0f) : 0.0f;
            const std::string &raw_eta = (win == 0) ? *p.eta5 : *p.eta7;
            bool trouble = tokentide_poller::window_off_pace(u_ok, u_raw, el);

            if (slot_prov_last[i] != prov_id) {
              slot_prov_last[i] = prov_id;
              lv_obj_set_style_text_color(vals[i], lv_color_hex(p.col), 0);
              lv_obj_set_style_bg_color(fils[i], lv_color_hex(p.col), 0);
              for (int k = 0; k < 6; k++) lv_obj_set_style_bg_color(sts[i][k], lv_color_hex(p.col), 0);
              lv_image_set_src(cars[i], p.car_dsc);
            }
            int trbl_i = trouble ? 1 : 0;
            if (slot_trbl_last[i] != trbl_i) {
              slot_trbl_last[i] = trbl_i;
              lv_obj_set_style_text_color(etas[i], lv_color_hex(trouble ? 0xf2a88d : 0xccc19c), 0);
              lv_image_set_src(signals[i], trouble ? pace_tr_dsc : pace_ok_dsc);
            }
            int mode_i = (N == 3) ? 3 : 2;
            if (slot_mode_last[i] != mode_i) {
              slot_mode_last[i] = mode_i;
              if (N == 3) {
                lv_obj_set_style_text_font(lbls[i], id(font_meta), 0);
                lv_obj_set_style_text_font(vals[i], id(font_small), 0);
                lv_obj_set_style_text_font(etas[i], id(font_meta), 0);
              } else {
                lv_obj_set_style_text_font(lbls[i], id(font_small), 0);
                lv_obj_set_style_text_font(vals[i], id(font_mid), 0);
                lv_obj_set_style_text_font(etas[i], id(font_meta), 0);
              }
            }

            std::string v_str = "--%";
            if (u_ok) {
              char vb[8];
              snprintf(vb, sizeof(vb), "%d%%", (int) lroundf(u_raw < 0.0f ? 0.0f : u_raw));
              v_str = vb;
            }
            if (v_str != val_last[i]) { val_last[i] = v_str; lv_label_set_text(vals[i], v_str.c_str()); }

            int tx = 0, ty = 0, tw = 0, th = big ? 16 : 8, pad = big ? 13 : 7;
            if (N < 3) {
              int ly = (N == 1) ? (big ? ry1_b[i] : ry1_s[i]) : (big ? ry2_b[i] : ry2_s[i]);
              std::string l_str = std::string(none_configured ? "${str_setup}" : p.name) + (win == 0 ? " 5h" : " 7d");
              if (l_str != lbl_last[i]) { lbl_last[i] = l_str; lv_label_set_text(lbls[i], l_str.c_str()); }

              std::string e_str;
              if (p.state == tokentide_poller::STATE_NO_DATA) {
                e_str = "${str_no_data}";
              } else if (t_ok) {
                char eb[32];
                snprintf(eb, sizeof(eb), big ? "${str_time} %d%% | %s" : "${str_time_short}:%d%% | %s",
                         (int) lroundf(t_val), raw_eta.c_str());
                e_str = eb;
              } else {
                e_str = std::string("${str_resets_in} ") + raw_eta;
              }
              if (e_str != eta_last[i]) { eta_last[i] = e_str; lv_label_set_text(etas[i], e_str.c_str()); }

              lv_obj_set_pos(lbls[i], big ? 8 : 4, big ? ly + 4 : ly);
              lv_obj_set_width(lbls[i], big ? 88 : 64);
              lv_obj_set_pos(vals[i], big ? 98 : 68, ly - (big ? 1 : 3));
              lv_obj_set_width(vals[i], big ? 68 : 48);
              lv_obj_set_pos(etas[i], big ? 170 : 118, big ? ly + 4 : ly);
              lv_obj_set_size(etas[i], big ? 142 : 118, big ? 20 : 16);

              tx = big ? 16 : 8;
              ty = ly + (big ? 28 : 19);
              tw = big ? 288 : 224;
            } else {
              int ly = big ? ry3_b[p_idx] : ry3_s[p_idx];
              int cx = (win == 0) ? (big ? 8 : 4) : (big ? 164 : 124);
              int cw = big ? 148 : 112;

              std::string l_str = (win == 0)
                  ? (std::string(big ? p.name : p.short_name) + " 5h")
                  : std::string("7d");
              if (l_str != lbl_last[i]) { lbl_last[i] = l_str; lv_label_set_text(lbls[i], l_str.c_str()); }

              std::string e_str;
              for (char ch : raw_eta) {
                // The small paired cells fit the leading countdown unit.
                if (!big && ch == ' ') break;
                if (ch != ' ') e_str.push_back(ch);
              }
              if (big && e_str.size() > 5) e_str = raw_eta.substr(0, raw_eta.find(' '));
              if (p.state == tokentide_poller::STATE_NO_DATA) e_str = "${str_no_data}";
              if (e_str != eta_last[i]) { eta_last[i] = e_str; lv_label_set_text(etas[i], e_str.c_str()); }

              lv_obj_set_pos(lbls[i], cx, ly);
              lv_obj_set_width(lbls[i], big ? 94 : 70);
              lv_obj_set_pos(vals[i], cx + (big ? 100 : 74), ly - 1);
              lv_obj_set_width(vals[i], big ? 48 : 38);
              lv_obj_set_pos(etas[i], cx, ly + (big ? 20 : 13));
              lv_obj_set_size(etas[i], cw, big ? 16 : 13);

              tx = cx;
              ty = ly + (big ? 38 : 26);
              tw = cw;
            }

            int U = tw - 2 * pad;
            int used = u_ok ? (int) lroundf(U * u_val / 100.0f) : 0;
            int elapsed = t_ok ? (int) lroundf(U * t_val / 100.0f) : 0;
            auto rect = [&](lv_obj_t *o, int x, int y, int w, int h, bool on) {
              show(o, on && w > 0);
              if (on && w > 0) { lv_obj_set_pos(o, x, y); lv_obj_set_size(o, w, h); }
            };
            lv_obj_set_pos(routes[i], tx, ty);
            lv_obj_set_size(routes[i], tw, th);
            rect(tbeds[i], pad, 0, elapsed, th, t_ok);
            rect(obeds[i], pad + elapsed, 0, used - elapsed, th, trouble);
            int tiles = (tw + (big ? 47 : 23)) / (big ? 48 : 24);
            for (int j = 0; j < 10; j++) {
              if (!rails[i][j]) continue;
              show(rails[i][j], j < tiles);
              if (j < tiles) lv_obj_set_pos(rails[i][j], j * (big ? 48 : 24), 0);
            }
            rect(fils[i], pad, big ? 6 : 3, used, big ? 4 : 2, u_ok);
            int A = pad + used;
            for (int k = 0; k < 6; k++) {
              int cx = pad + (int) lroundf(U * k / 5.0f);
              lv_obj_set_pos(sts[i][k], cx - (big ? 3 : 1), big ? 5 : 2);
              lv_obj_set_size(sts[i][k], big ? 6 : 3, big ? 6 : 3);
              bool filled = u_ok && cx <= A;
              show(ins[i][k], !filled);
              if (!filled) {
                lv_obj_set_pos(ins[i][k], cx - (big ? 2 : 0), big ? 6 : 3);
                lv_obj_set_size(ins[i][k], big ? 4 : 1, big ? 4 : 1);
              }
            }
            show(cars[i], u_ok);
            if (u_ok) lv_obj_set_pos(cars[i], A - (big ? 13 : 6), (big ? 2 : 1) + bob);
            // Signals stay above the car when the two readings coincide.
            show(signals[i], t_ok);
            if (t_ok) lv_obj_set_pos(signals[i], tx + pad + elapsed - (big ? 6 : 3), ty - (big ? 4 : 2));
          }

interval:
  - interval: 500ms
    then:
      - script.execute: theme_metro_redraw
