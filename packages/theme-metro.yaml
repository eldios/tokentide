# Metro theme page: "Agents Metro Station". The four progress tracks are
# four rail routes: warm for the Claude windows, teal for the Codex windows
# (shown only when a Codex token is configured). Real rails run under each
# route; the provider fill rides between them up to the car at the tip, and
# six station dots fill as the car passes. Every window shows its written
# percentage and reset countdown. The scene strip is the waiting platform:
# a hanging station sign (text is a label, never baked into art) and little
# commuters that wander in, wait tapping a foot, and leave.
#
# Self-contained theme package (see packages/themes.yaml for the switcher
# and packages/theme-graveyard.yaml for the shared-id roster). Layout is
# computed at runtime from the display width; boards pick car sprite files
# via theme_sprite_size (scene sprites use the small files).

substitutions:
  theme_sprite_base: "https://raw.githubusercontent.com/eldios/tokentide/main/assets/sprites"
  theme_sprite_size: "big"
  theme_tap_script: "note_activity"
  theme_long_press_script: "theme_next"

globals:
  - id: theme_metro_active
    type: bool
    restore_value: no
    initial_value: "false"

image:
  - file: ${theme_sprite_base}/me-car-warm-mini-${theme_sprite_size}-r.png
    id: me_spr_car_warm
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/me-car-teal-mini-${theme_sprite_size}-r.png
    id: me_spr_car_teal
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/me-rail-${theme_sprite_size}.png
    id: me_spr_rail
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/me-actor-a-1-small.png
    id: me_spr_actor_a_1
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/me-actor-a-2-small.png
    id: me_spr_actor_a_2
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/me-actor-b-1-small.png
    id: me_spr_actor_b_1
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/me-actor-b-2-small.png
    id: me_spr_actor_b_2
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/me-actor-c-1-small.png
    id: me_spr_actor_c_1
    type: RGB565
    transparency: alpha_channel
  - file: ${theme_sprite_base}/me-actor-c-2-small.png
    id: me_spr_actor_c_2
    type: RGB565
    transparency: alpha_channel

lvgl:
  pages:
    - id: theme_metro_page
      bg_color: 0x0d0d10
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: "id(theme_metro_active) = true;"
        # Lay the page out immediately: the interval alone would leave the
        # placeholder geometry on screen for up to one tick.
        - script.execute: theme_metro_redraw
      on_unload:
        - lambda: "id(theme_metro_active) = false;"
      widgets:
        - obj:
            id: me_tap
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            on_short_click:
              - script.execute: ${theme_tap_script}
            on_long_press:
              - script.execute: ${theme_long_press_script}
        # --- scene strip: the waiting platform ---
        - obj:
            id: me_scene
            x: 8
            y: 22
            width: 304
            height: 38
            clickable: false
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "off"
            scrollable: false
            widgets:
              - obj: { id: me_sign_field, x: 0, y: 0, width: 10, height: 10, bg_color: 0x493226, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
              - obj: { id: me_sign_inset, x: 0, y: 0, width: 10, height: 10, bg_color: 0xeee1b5, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
              - obj: { id: me_sign_post_l, x: 0, y: 0, width: 1, height: 4, bg_color: 0x696e68, bg_opa: COVER, border_width: 0, radius: 0, clickable: false }
