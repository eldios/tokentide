# Usage engine: minimal probe POST to /v1/messages, unified rate-limit
# headers read from the response. Runs in a dedicated FreeRTOS task (the
# tokentide_poller external component) so the UI never stutters during the
# request - ESPHome's http_request action would block the main loop for
# the whole TLS+HTTP round trip.
# The cleaner GET api/oauth/usage endpoint rejects long-lived
# setup-tokens with 403 (tested 2026-07-21), so headers it is.

substitutions:
  # Where the tokentide_poller component comes from. Pinned to the release
  # tag matching tokentide_version: a new release is a new ref, so the
  # component cache can never lag behind the packages (mixing a fresh
  # package with a stale component clone breaks validation). Local dev
  # entry points override this with the in-repo "components" directory.
  tokentide_components_source: "github://eldios/tokentide@v${tokentide_version}"
  # Provider display labels, available to every theme page.
  claude_label: "Claude"
  codex_label: "Codex"

external_components:
  - source: ${tokentide_components_source}
    components: [tokentide_poller]
    refresh: 1d

globals:
  - id: reset_5h_epoch
    type: long
    restore_value: no
    initial_value: "0"
  - id: reset_7d_epoch
    type: long
    restore_value: no
    initial_value: "0"
  - id: last_poll_ok
    type: bool
    restore_value: no
    initial_value: "false"
  - id: poll_in_flight
    type: bool
    restore_value: no
    initial_value: "false"
  # 0 = ok, 1 = near limit (allowed_warning), 2 = limit reached (rejected).
  # Numeric mirror of the unified status header for LED/UI consumers.
  - id: limit_level
    type: int
    restore_value: no
    initial_value: "0"
  # Codex (ChatGPT) provider slot: declared here so theme pages can
  # reference these ids in every build; packages/provider-openai.yaml is
  # the opt-in package that actually fills them. Percentages are 0-100
  # with -1 = unknown, epochs 0 = unknown.
  - id: codex_present
    type: bool
    restore_value: no
    initial_value: "false"
  - id: codex_5h_pct
    type: float
    restore_value: no
    initial_value: "-1"
  - id: codex_7d_pct
    type: float
    restore_value: no
    initial_value: "-1"
  - id: reset_codex_5h_epoch
    type: long
    restore_value: no
    initial_value: "0"
  - id: reset_codex_7d_epoch
    type: long
    restore_value: no
    initial_value: "0"
  # 0 = not configured, 1 = ok, 2 = auth error, 3 = network error.
  - id: codex_state
    type: int
    restore_value: no
    initial_value: "0"

sensor:
  - platform: template
    id: usage_5h
    name: "Claude 5h Utilization"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: usage_7d
    name: "Claude 7d Utilization"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    id: usage_status
    name: "Claude Limit Status"
    update_interval: never
  - platform: template
    id: anthropic_status
    name: "Anthropic Status"
    entity_category: diagnostic
    update_interval: never

tokentide_poller:
  id: usage_probe
  token: ${claude_token}
  # Anthropic status page (statuspage.io indicator). "unknown" means the
  # check itself failed - keep the previous state rather than lying.
  on_anthropic_status:
    - lambda: |-
        if (indicator == "unknown") return;
        id(anthropic_status).publish_state(indicator);
        if (indicator == "none") {
          lv_obj_add_flag(id(status_dot), LV_OBJ_FLAG_HIDDEN);
        } else {
          uint32_t color = 0xF5D90A;                       // minor/maintenance
          if (indicator == "major")    color = 0xF76B15;
          if (indicator == "critical") color = 0xE5484D;
          lv_obj_set_style_bg_color(id(status_dot), lv_color_hex(color), 0);
          lv_obj_clear_flag(id(status_dot), LV_OBJ_FLAG_HIDDEN);
        }
  on_result:
    - lambda: |-
        // Any response carrying the unified headers is data, whatever the
        // status code: a probe rejected with 429 at the limit still sends
        // them (utilization then reads over 100%), and the limit is
        // exactly when the meter matters. Error paths apply only when the
        // headers are absent.
        if (code == 200 || u5 >= 0 || u7 >= 0) {
          if (u5 >= 0) id(usage_5h).publish_state(u5 * 100.0f);
          if (u7 >= 0) id(usage_7d).publish_state(u7 * 100.0f);
          id(reset_5h_epoch) = (long) r5;
          id(reset_7d_epoch) = (long) r7;
          // Localized display mapping for the unified status header.
          if (status == "allowed")              { id(limit_level) = 0; id(usage_status).publish_state("${str_status_ok}"); }
          else if (status == "allowed_warning") { id(limit_level) = 1; id(usage_status).publish_state("${str_status_warning}"); }
          else if (status == "rejected")        { id(limit_level) = 2; id(usage_status).publish_state("${str_status_limit}"); }
          else if (code == 429)                 { id(limit_level) = 2; id(usage_status).publish_state("${str_status_limit}"); }
          else                                  { id(limit_level) = 0; id(usage_status).publish_state(status.empty() ? "${str_status_ok}" : status); }
          id(last_poll_ok) = true;
        } else if (code == 401 || code == 403) {
          id(usage_status).publish_state("${str_token_error}");
          id(last_poll_ok) = false;
        } else if (code == 0) {
          id(usage_status).publish_state("${str_net_error}");
          id(last_poll_ok) = false;
        } else {
          id(usage_status).publish_state("HTTP " + to_string(code));
          id(last_poll_ok) = false;
        }
        id(poll_in_flight) = false;

script:
  - id: poll_usage
    mode: single
    then:
      # Contract: every UI package provides lbl_status.
      - lambda: |-
          id(poll_in_flight) = true;
          lv_label_set_text(id(lbl_status), "${str_refreshing}");
      - tokentide_poller.poll: usage_probe

interval:
  - interval: ${poll_interval}s
    startup_delay: 15s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: poll_usage
  - interval: 15min
    startup_delay: 90s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - tokentide_poller.check_status: usage_probe
