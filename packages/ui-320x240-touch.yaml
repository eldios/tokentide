# Rich LVGL UI for 320x240 touch panels - the point of this project:
# readable from desk distance. Instrument-cluster telemetry layout with
# adaptive 1, 2, or 3 provider cards, Figtree Bold hero percentages, and
# a coupled dual-horizon pace gauge (budget used vs. time elapsed).
# All user-visible strings come from ${str_*} substitutions (see
# packages/common.yaml for the English defaults and lang/ for packs).

font:
  - file: "gfonts://Figtree@700"
    id: font_hero
    size: 52
    glyphs: "0123456789%?- "
  - file: "gfonts://Figtree@700"
    id: font_hero_2p
    size: 34
    glyphs: "0123456789%?- "
  - file: "gfonts://Figtree@700"
    id: font_hero_3p
    size: 25
    glyphs: "0123456789%?- "
  # UI contract: every UI package provides font_mid and font_small with
  # the full glyph set for theme pages. The default glyph set has no
  # accented letters, which the lang/ packs need.
  - file: "gfonts://Figtree@600"
    id: font_mid
    size: 26
    glyphsets: [GF_Latin_Kernel]
    glyphs: "ÀÁÄÇÈÉÊÌÍÑÒÓÖÙÚÜßàáâäçèéêëìíîïñòóôöùúûü¡¿"
  - file: "gfonts://Figtree@400"
    id: font_small
    size: 16
    glyphsets: [GF_Latin_Kernel]
    glyphs: "ÀÁÄÇÈÉÊÌÍÑÒÓÖÙÚÜßàáâäçèéêëìíîïñòóôöùúûü¡¿"
  - file: "gfonts://Figtree@600"
    id: font_meta
    size: 12
    glyphsets: [GF_Latin_Kernel]
    glyphs: "ÀÁÄÇÈÉÊÌÍÑÒÓÖÙÚÜßàáâäçèéêëìíîïñòóôöùúûü¡¿"

lvgl:
  id: main_lvgl
  displays: [main_lcd]
  touchscreens: [main_touch]
  buffer_size: 25%
  pages:
    - id: main_page
      bg_color: 0x08090C
      scrollbar_mode: "off"
      scrollable: false
      widgets:
        # Full-page tap target (bottom of the z-order: real widgets stay
        # clickable on top). Same gesture substitutions as the theme
        # pages: tap defaults to wake/presence only (boards set
        # theme_tap_script), long press cycles the theme.
        - obj:
            id: main_tap
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            # short_click, not click: LVGL fires CLICKED on release even
            # after LONG_PRESSED, which would also fire the tap action.
            on_short_click:
              - script.execute: ${theme_tap_script}
            on_long_press:
              - script.execute: ${theme_long_press_script}

        # --- top status bar (y = 0..21) ---
        # UI contract: every UI provides status_dot and lbl_status.
        - obj:
            id: status_dot
            x: 8
            y: 7
            width: 8
            height: 8
            radius: 4
            bg_color: 0x4CC38A
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            clickable: false
        - label:
            id: lbl_status
            x: 20
            y: 4
            text_font: font_meta
            text_color: 0xECE9E0
            text: "${str_waiting}"
        - obj: { id: batt_box, hidden: true, x: 250, y: 7, width: 14, height: 8, radius: 1, bg_opa: TRANSP, border_width: 1, border_color: 0x8C887F, pad_all: 0, clickable: false }
        - obj: { id: batt_nub, hidden: true, x: 264, y: 9, width: 2, height: 4, radius: 0, bg_color: 0x8C887F, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - obj: { id: batt_fill, hidden: true, x: 252, y: 9, width: 10, height: 4, radius: 0, bg_color: 0x4CC38A, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }
        - label:
            id: lbl_batt
            align: TOP_RIGHT
            x: -8
            y: 4
            text_font: font_meta
            text_color: 0x8C887F
            text: ""
        - obj: { id: hdr_line, x: 8, y: 21, width: 304, height: 1, radius: 0, bg_color: 0x1D202A, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false }

